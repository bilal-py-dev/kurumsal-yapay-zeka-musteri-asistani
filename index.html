<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaTeknoloji - AI Müşteri Asistanı</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 100%; max-width: 480px; height: 640px; background: #1e293b; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: 1px solid #334155; }
        .chat-header { background: #2563eb; padding: 18px 20px; display: flex; align-items: center; gap: 12px; }
        .status-dot { width: 10px; height: 10px; background: #4ade80; border-radius: 50%; }
        .chat-header h3 { margin: 0; font-size: 16px; }
        .chat-header span { font-size: 12px; color: #dbeafe; display: block; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.5; }
        .bot { background: #334155; align-self: flex-start; border-bottom-left-radius: 4px; }
        .user { background: #2563eb; align-self: flex-end; border-bottom-right-radius: 4px; }
        .chat-input { display: flex; padding: 14px; background: #0f172a; border-top: 1px solid #334155; gap: 10px; }
        input { flex: 1; background: #1e293b; border: 1px solid #334155; color: white; padding: 12px 14px; border-radius: 10px; outline: none; font-size: 14px; }
        button { background: #2563eb; color: white; border: none; padding: 0 20px; border-radius: 10px; font-weight: 600; cursor: pointer; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <div class="status-dot"></div>
        <div>
            <h3>NovaTeknoloji AI Destek</h3>
            <span>7/24 Akıllı Müşteri Asistanı</span>
        </div>
    </div>
    <div class="chat-box" id="chatBox">
        <div class="msg bot">Merhaba! Ben NovaTeknoloji Yapay Zeka Asistanı. Kargo, iade, garanti veya çalışma saatlerimizle ilgili bana her şeyi sorabilirsiniz.</div>
    </div>
    <div class="chat-input">
        <input type="text" id="soruInput" placeholder="Sorunuzu yazın..." onkeypress="if(event.key==='Enter') mesajGonder()">
        <button onclick="mesajGonder()">Gönder</button>
    </div>
</div>

<script>
    let sohbetGecmisi = [];

    async function mesajGonder() {
        const input = document.getElementById("soruInput");
        const chatBox = document.getElementById("chatBox");
        const soru = input.value.trim();
        if (!soru) return;

        chatBox.innerHTML += `<div class="msg user">${soru}</div>`;
        input.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        const yukleniyorId = "yukleniyor-" + Date.now();
        chatBox.innerHTML += `<div class="msg bot" id="${yukleniyorId}">Yazıyor...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const res = await fetch("/soru-sor", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    musteri_adi: "Ziyaretçi",
                    soru: soru,
                    gecmis: sohbetGecmisi
                })
            });
            const data = await res.json();
            document.getElementById(yukleniyorId).remove();

            if (res.ok) {
                chatBox.innerHTML += `<div class="msg bot">${data.yapay_zeka_yaniti}</div>`;
                sohbetGecmisi.push({ kullanici: soru, asistan: data.yapay_zeka_yaniti });
            } else {
                chatBox.innerHTML += `<div class="msg bot">Hata: ${data.detail}</div>`;
            }
        } catch (err) {
            document.getElementById(yukleniyorId).remove();
            chatBox.innerHTML += `<div class="msg bot">Sunucuya bağlanılamadı.</div>`;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>
</body>
</html>
